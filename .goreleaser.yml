version: 2
project_name: 'speedtest-go'
#dist: ./out
before:
  hooks:
    - go mod download
builds:
  - main: ./main.go
    id: speedtest-backend
    binary: speedtest-backend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -w -s
    goos:
      - windows
      - linux
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 5
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
  - main: ./main.go
    id: speedtest-backend-darwin
    binary: speedtest-backend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -w -s
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - main: ./main.go
    id: speedtest-backend-freebsd
    binary: speedtest-backend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -w -s
    goos:
      - freebsd
    goarch:
      - amd64
      - arm64
  - main: ./main.go
    id: speedtest-backend-noupx-windows-arm64
    binary: speedtest-backend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -w -s
    goos:
      - windows
    goarch:
      - arm
      - arm64
    goarm:
      - 5
      - 6
      - 7
archives:
  - format_overrides:
      - goos: windows
        formats: zip
    files:
      - README.md
      - LICENSE
      - settings.toml
upx:
  # FreeBSD and macOS binaries are left alone: UPX cannot pack the macOS
  # ones, and on the FreeBSD ones it either fails or reports an internal
  # error that aborts the release.
  - ids: [speedtest-backend]
    goos:
      - linux
      - windows
    compress: "9"
    enabled: true
checksum:
  name_template: 'checksums.txt'
changelog:
  disable: false
  sort: asc
release:
  github:
    owner: librespeed
    name: speedtest-go
  disable: false
